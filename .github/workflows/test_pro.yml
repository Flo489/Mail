name: Test Pro sauvageflorent.pro

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action a effectuer'
        required: true
        type: choice
        options:
          - send_initial
          - check_reply
        default: send_initial
      reset:
        description: 'Reinitialiser le fichier de test avant d executer'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test-pro:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Réinitialiser le fichier de test si demandé
        if: ${{ github.event.inputs.reset == 'true' }}
        run: |
          rm -f data/test_pro_state.json
          echo "Fichier data/test_pro_state.json supprimé pour repartir à zéro."

      - name: Exécuter le test
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TARGET_EMAIL: 'sauvageflorent.pro@gmail.com'
          MOTHER_EMAIL: 'sauvageflorent.pro@gmail.com'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          USER_NAME: ${{ vars.USER_NAME || 'Florent' }}
          STATE_FILE: 'data/test_pro_state.json'
          IS_TEST: 'true'
          FORCE_START_NOW: ${{ github.event.inputs.action == 'send_initial' && 'true' || 'false' }}
        run: |
          python main.py

      - name: Sauvegarder l'état de test mis à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/test_pro_state.json)" ]; then
            git add data/test_pro_state.json
            git commit -m "chore(test): mise à jour état test pro [skip ci]"
            git push
          else
            echo "Aucune modification d'état à sauvegarder."
          fi
